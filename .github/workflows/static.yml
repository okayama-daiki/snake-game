name: CI/CD

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: "wasm-pack@0.15.0"
      - name: Install dependencies
        run: bun ci
      - name: Lint
        run: bun run lint
      - name: Test game engine
        run: cargo test --manifest-path src/services/game/Cargo.toml
      - name: Test server
        run: cargo test --manifest-path src/services/server/Cargo.toml
      - name: Build
        run: bun run build
        env:
          VITE_WSS_URI: ${{ secrets.VITE_WSS_URI }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
