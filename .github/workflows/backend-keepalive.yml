name: Backend Keepalive

on:
  schedule:
    # Render free services sleep after 15 minutes of inactivity. Offset the
    # schedule from the top of the hour to reduce GitHub Actions queue delays.
    - cron: "3/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check backend health
        run: >-
          curl --fail --silent --show-error
          --retry 3 --retry-delay 5 --retry-all-errors --max-time 30
          https://snake-game-kagw.onrender.com/health
