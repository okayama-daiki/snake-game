[package]
name = "snake-game"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.127"
console_error_panic_hook = "0.1.7"
anyhow = "1.0.104"
game = { path = "../game" }

[dependencies.web-sys]
version = "0.3.104"
features = [
  'BinaryType',
  'Blob',
  'CanvasRenderingContext2d',
  'Document',
  'FileReader',
  'HtmlCanvasElement',
  'ImageData',
  'MessageEvent',
  'MouseEvent',
  'Performance',
  'WebSocket',
  'Window',
  'console'
] # Ref: https://rustwasm.github.io/wasm-bindgen/api/web_sys/
