[package]
name = "snake-game-backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix = "0.13.5"
actix-web = { version = "4.14.1", features = ["openssl"] }
actix-web-actors = "4.3.1"
openssl = { version = "0.10.81", features = ["v110"] }
uuid = { version = "1.24.1", features = ["v4"] }
dotenvy = "0.15.7"
game = { path = "../game" }
